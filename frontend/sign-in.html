<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - CampusShield</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="/css/style.css">
  <script async crossorigin="anonymous" data-clerk-publishable-key="pk_test_Y2F1c2FsLWd1cHB5LTk3MTQuY2xlcmsuYWNjb3VudHMuZGV2JA" src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js" type="text/javascript"></script>
</head>
<body class="bg-[#F4F7F9] text-[#1C252E] flex flex-col min-h-screen">

  <div id="app-header"></div>

  <main class="flex-grow py-12 px-4 flex flex-col justify-center items-center">
    <div class="text-center mb-8 space-y-2">
      <div class="w-12 h-12 rounded-2xl bg-[#5C6F84] flex items-center justify-center mx-auto shadow-md text-2xl">
        🛡️
      </div>
      <h1 class="text-3xl font-black text-[#2C3A47]">Welcome Back</h1>
      <p class="text-sm font-medium text-[#5C6F84]">Sign in to CampusShield Grievance Portal</p>
    </div>

    <!-- Clerk Official UI Mount Container -->
    <div id="clerk-sign-in" class="shadow-2xl rounded-3xl border border-[#C2CFDB] overflow-hidden bg-white p-2 mb-6"></div>

    <!-- Native HTML/CSS Sign In Form Container -->
    <div id="native-sign-in" class="bg-white rounded-3xl p-8 max-w-md w-full shadow-xl border border-[#C2CFDB] space-y-6">
      <form id="sign-in-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-[#2C3A47] mb-1">
            Email Address *
          </label>
          <input type="email" id="input-email" required placeholder="alex@campus.edu" class="w-full px-4 py-2.5 rounded-xl border border-[#C2CFDB] text-sm focus:outline-none focus:ring-2 focus:ring-[#5C6F84]">
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-[#2C3A47] mb-1">
            Full Name
          </label>
          <input type="text" id="input-name" placeholder="Alex Johnson" class="w-full px-4 py-2.5 rounded-xl border border-[#C2CFDB] text-sm focus:outline-none focus:ring-2 focus:ring-[#5C6F84]">
        </div>

        <button type="submit" class="w-full py-3 rounded-xl bg-[#2C3A47] text-[#A4B4C0] font-bold text-sm hover:bg-[#1E293B] transition-all shadow-md">
          Sign In
        </button>
      </form>

      <!-- Quick Demo Login Buttons -->
      <div class="pt-4 border-t border-[#C2CFDB]/60 space-y-2 text-center">
        <span class="text-[11px] font-bold uppercase text-gray-400 block">Quick Role Switch</span>
        <div class="flex gap-2">
          <button id="btn-demo-student" class="w-1/2 py-2 rounded-xl bg-[#DCE4EC] text-[#2C3A47] font-bold text-xs hover:bg-[#C2CFDB]">
            Demo Student
          </button>
          <button id="btn-demo-admin" class="w-1/2 py-2 rounded-xl bg-[#5C6F84] text-white font-bold text-xs hover:bg-[#2C3A47]">
            Demo Admin
          </button>
        </div>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script type="module">
    import { renderNavigation } from '/js/navigation.js';
    import { initClerk, loginLocalUser } from '/js/auth.js';

    document.addEventListener('DOMContentLoaded', async () => {
      await renderNavigation();
      const clerk = await initClerk();
      if (clerk && clerk.mountSignIn) {
        try {
          clerk.mountSignIn(document.getElementById('clerk-sign-in'), {
            signUpUrl: '/sign-up.html',
            afterSignInUrl: '/index.html'
          });
        } catch (e) {
          console.warn("Clerk mount warning:", e);
        }
      }

      // Native Form Submission
      const form = document.getElementById('sign-in-form');
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const email = document.getElementById('input-email').value;
          const name = document.getElementById('input-name').value;
          const user = loginLocalUser(email, name);
          if (user.isAdmin) {
            window.location.href = '/admin-dashboard.html';
          } else {
            window.location.href = '/index.html';
          }
        });
      }

      // Demo logins
      document.getElementById('btn-demo-student').onclick = () => {
        loginLocalUser('student@campus.edu', 'Alex Student');
        window.location.href = '/index.html';
      };

      document.getElementById('btn-demo-admin').onclick = () => {
        loginLocalUser('mohamedkaisibrahim2@gmail.com', 'System Admin');
        window.location.href = '/admin-dashboard.html';
      };
    });
  </script>
</body>
</html>

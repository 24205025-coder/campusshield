<!DOCTYPE html>
<html lang="en">
<head>`n    <script src="/js/config.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - CampusShield</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="/css/style.css">
  <script async crossorigin="anonymous" data-clerk-publishable-key="pk_test_Y2F1c2FsLWd1cHB5LTk3MTQuY2xlcmsuYWNjb3VudHMuZGV2JA" src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js" type="text/javascript"></script>
</head>
<body class="bg-[#F4F7F9] text-[#1C252E] flex flex-col min-h-screen">

  <div id="app-header"></div>

  <main class="flex-grow py-12 px-4 flex flex-col justify-center items-center">
    <div class="text-center mb-8 space-y-2">
      <div class="w-12 h-12 rounded-2xl bg-[#5C6F84] flex items-center justify-center mx-auto shadow-md text-2xl">
        🛡️
      </div>
      <h1 class="text-3xl font-black text-[#2C3A47]">Create Your Account</h1>
      <p class="text-sm font-medium text-[#5C6F84]">Join CampusShield Grievance Portal</p>
    </div>

    <!-- Clerk Official UI Mount Container -->
    <div id="clerk-sign-up" class="shadow-2xl rounded-3xl border border-[#C2CFDB] overflow-hidden bg-white p-2 mb-6"></div>

    <!-- Native HTML/CSS Sign Up Form Container -->
    <div id="native-sign-up" class="bg-white rounded-3xl p-8 max-w-md w-full shadow-xl border border-[#C2CFDB] space-y-6">
      <form id="sign-up-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-[#2C3A47] mb-1">
            Full Name *
          </label>
          <input type="text" id="input-signup-name" required placeholder="Alex Johnson" class="w-full px-4 py-2.5 rounded-xl border border-[#C2CFDB] text-sm focus:outline-none focus:ring-2 focus:ring-[#5C6F84]">
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-[#2C3A47] mb-1">
            Student Email Address *
          </label>
          <input type="email" id="input-signup-email" required placeholder="alex@campus.edu" class="w-full px-4 py-2.5 rounded-xl border border-[#C2CFDB] text-sm focus:outline-none focus:ring-2 focus:ring-[#5C6F84]">
        </div>

        <button type="submit" class="w-full py-3 rounded-xl bg-[#2C3A47] text-[#A4B4C0] font-bold text-sm hover:bg-[#1E293B] transition-all shadow-md">
          Create Account
        </button>
      </form>
    </div>
  </main>

  <div id="app-footer"></div>

  <script type="module">
    import { renderNavigation } from '/js/navigation.js';
    import { initClerk, loginLocalUser } from '/js/auth.js';

    document.addEventListener('DOMContentLoaded', async () => {
      await renderNavigation();
      const clerk = await initClerk();
      if (clerk && clerk.mountSignUp) {
        try {
          clerk.mountSignUp(document.getElementById('clerk-sign-up'), {
            signInUrl: '/sign-in.html',
            afterSignUpUrl: '/index.html'
          });
        } catch (e) {
          console.warn("Clerk mount warning:", e);
        }
      }

      // Native Form Submission
      const form = document.getElementById('sign-up-form');
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const email = document.getElementById('input-signup-email').value;
          const name = document.getElementById('input-signup-name').value;
          loginLocalUser(email, name);
          window.location.href = '/index.html';
        });
      }
    });
  </script>
</body>
</html>
